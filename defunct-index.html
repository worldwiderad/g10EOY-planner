<title>G10 Schedule</title>
<style>
  :root {
    --bg: #0e0e10;
    --panel: #161618;
    --panel-2: #1d1d20;
    --border: #2a2a2e;
    --text: #e7e5e0;
    --muted: #8a8a90;
    --accent: #8B1E1E;
    --accent-soft: #5a1414;
    --amber: #b88a2c;
    --red: #c8341d;
    --good: #4a8c5a;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); color: var(--text); margin: 0; padding: 0; }
  body { font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", system-ui, sans-serif; padding-bottom: 4rem; }
  .mono { font-family: "SF Mono", Menlo, ui-monospace, monospace; }
  a { color: var(--text); }
  button { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--border); padding: 6px 10px; border-radius: 6px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  header {
    position: sticky; top: 0; z-index: 5;
    background: linear-gradient(to bottom, var(--bg) 80%, transparent);
    padding: 12px 16px 16px;
    border-bottom: 1px solid var(--border);
  }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .deadlines { display: flex; gap: 8px; flex-wrap: wrap; flex: 1 1 auto; }
  .deadline {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--muted);
    border-radius: 6px; padding: 6px 10px; min-width: 0;
    font-size: 13px;
  }
  .deadline.soon { border-left-color: var(--red); }
  .deadline.near { border-left-color: var(--amber); }
  .deadline .when { font-weight: 600; }
  .deadline .when.soon { color: var(--red); }
  .deadline .when.near { color: var(--amber); }
  .deadline .what { color: var(--muted); display: block; font-size: 12px; margin-top: 2px; }
  .progress {
    background: var(--panel); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; font-size: 12px; color: var(--muted);
    white-space: nowrap; align-self: flex-start;
  }
  .progress strong { color: var(--text); font-size: 14px; }
  .progress-bar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .progress-bar > span { display: block; height: 100%; background: var(--accent); transition: width 0.3s; }

  main { max-width: 880px; margin: 0 auto; padding: 16px; }

  nav.daynav { display: flex; align-items: center; gap: 8px; margin: 8px 0 18px; }
  nav.daynav .spacer { flex: 1; }
  .day-label { font-size: 20px; font-weight: 600; }
  .day-note { color: var(--muted); font-size: 13px; margin-bottom: 12px; }

  .day-table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .day-table tr { border-bottom: 1px solid var(--border); }
  .day-table tr:last-child { border-bottom: none; }
  .day-table tr.trackable { background: var(--panel-2); }
  .day-table tr.trackable.done { opacity: 0.5; }
  .day-table tr.trackable.done .task { text-decoration: line-through; }
  .day-table td { padding: 8px 10px; vertical-align: top; }
  .day-table td.time { width: 28%; color: var(--muted); white-space: nowrap; font-family: "SF Mono", Menlo, ui-monospace, monospace; font-size: 13px; }
  .day-table td.task { width: 65%; }
  .day-table td.check { width: 7%; text-align: center; }
  .day-table .deadline-row { background: rgba(139, 30, 30, 0.15); }
  .day-table .deadline-row td.task { font-weight: 600; }
  input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }

  section.weeks { margin-top: 40px; }
  section.weeks h2 { font-size: 16px; color: var(--muted); font-weight: 500; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em; }
  .weeks-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .weeks-table th, .weeks-table td { padding: 6px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
  .weeks-table th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; }
  .weeks-table tr.today td { background: rgba(139, 30, 30, 0.18); }
  .weeks-table tr.deadline td.event { font-weight: 700; color: var(--text); }
  .weeks-table td.day { white-space: nowrap; width: 90px; }
  .weeks-table td.event { width: 35%; color: var(--muted); }
  .weeks-table tr.deadline td.event { color: var(--text); }
  .weeks-table td a { color: inherit; text-decoration: none; cursor: pointer; }
  .weeks-table td a:hover { color: var(--accent); }
  .weeks-table tr.weekstart td { border-top: 2px solid var(--border); }

  .footer-note { color: var(--muted); font-size: 12px; margin-top: 24px; text-align: center; }

  @media (max-width: 600px) {
    header { padding: 10px 12px 12px; }
    main { padding: 12px; }
    .deadline { font-size: 12px; padding: 5px 8px; }
    .day-table td.time { width: 32%; font-size: 12px; }
    .day-label { font-size: 17px; }
    nav.daynav button { padding: 6px 8px; font-size: 13px; }
  }
</style>

// ---- helpers ----
const $ = (s) => document.querySelector(s);
const pad = (n) => String(n).padStart(2, "0");
const todayISO = () => {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
};
const isoToDate = (iso) => {
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m-1, d);
};
const daysBetween = (aIso, bIso) => Math.round((isoToDate(bIso) - isoToDate(aIso)) / 86400000);

const PLAN_START = "2026-04-25";
const PLAN_END = "2026-06-05";

let currentISO = todayISO();
let currentNote = "";

function clampToPlan(iso) {
  if (iso < PLAN_START) { return { iso: PLAN_START, note: `Today (${iso}) is before the plan starts. Showing first day.` }; }
  if (iso > PLAN_END) { return { iso: PLAN_END, note: `Today (${iso}) is after the plan ends. Showing last day.` }; }
  // find the closest day in schedule.days
  const exact = schedule.days.find(d => d.date === iso);
  if (exact) return { iso, note: "" };
  // for Jun 1-5 fallback
  if (iso >= "2026-06-01" && iso <= "2026-06-05") {
    return { iso: "2026-06-01", note: `Showing Jun 1–5 loose week (today: ${iso}).` };
  }
  // pick nearest
  let best = schedule.days[0];
  let bestDist = Infinity;
  for (const d of schedule.days) {
    const dist = Math.abs(daysBetween(d.date, iso));
    if (dist < bestDist) { bestDist = dist; best = d; }
  }
  return { iso: best.date, note: `Showing closest scheduled day (today: ${iso}).` };
}

function dayIndex(iso) {
  return schedule.days.findIndex(d => d.date === iso);
}

function storageKey(date, idx) { return `g10:${date}:${idx}`; }

function isCheckedFor(date, idx) {
  return localStorage.getItem(storageKey(date, idx)) === "1";
}
function setChecked(date, idx, val) {
  if (val) localStorage.setItem(storageKey(date, idx), "1");
  else localStorage.removeItem(storageKey(date, idx));
}

// ---- deadlines ----
function renderDeadlines() {
  const today = todayISO();
  const upcoming = schedule.deadlines
    .filter(d => d.date >= today)
    .slice(0, 3);
  const el = $("#deadlines");
  el.innerHTML = "";
  if (upcoming.length === 0) {
    el.innerHTML = `<div class="deadline"><span class="when">All deadlines passed</span><span class="what">G10 wrapped</span></div>`;
    return;
  }
  for (const d of upcoming) {
    const dist = daysBetween(today, d.date);
    let cls = "", whenCls = "";
    if (dist < 3) { cls = "soon"; whenCls = "soon"; }
    else if (dist < 7) { cls = "near"; whenCls = "near"; }
    const distStr = dist === 0 ? "TODAY" : dist === 1 ? "tomorrow" : `${dist}d`;
    const div = document.createElement("div");
    div.className = `deadline ${cls}`;
    div.innerHTML = `<span class="when ${whenCls}">${distStr}</span> &middot; <span class="mono">${d.date.slice(5)}</span><span class="what">${d.label}</span>`;
    el.appendChild(div);
  }
}

// ---- progress ----
function renderProgress() {
  // current week = Mon..Sun containing today
  const t = isoToDate(todayISO());
  const dow = t.getDay(); // 0=Sun
  const offsetToMon = (dow === 0 ? -6 : 1 - dow);
  const monday = new Date(t); monday.setDate(t.getDate() + offsetToMon);
  const weekIsos = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday); d.setDate(monday.getDate() + i);
    weekIsos.push(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`);
  }
  let total = 0, done = 0;
  for (const day of schedule.days) {
    if (!weekIsos.includes(day.date)) continue;
    day.blocks.forEach((b, i) => {
      if (b.trackable) {
        total++;
        if (isCheckedFor(day.date, i)) done++;
      }
    });
  }
  const pct = total === 0 ? 0 : Math.round(100 * done / total);
  $("#pct").textContent = pct + "%";
  $("#pbar").style.width = pct + "%";
}

// ---- day view ----
function renderDay() {
  const idx = dayIndex(currentISO);
  if (idx === -1) return;
  const day = schedule.days[idx];
  $("#day-label").textContent = day.label + (day.date === todayISO() ? "  ·  today" : "");
  $("#day-sub").textContent = day.note || "";
  $("#day-note").textContent = currentNote;
  $("#day-note").style.display = currentNote ? "block" : "none";

  const tbody = $("#day-body");
  tbody.innerHTML = "";
  day.blocks.forEach((b, i) => {
    const tr = document.createElement("tr");
    if (b.trackable) tr.classList.add("trackable");
    if (b.deadline) tr.classList.add("deadline-row");
    const checked = b.trackable && isCheckedFor(day.date, i);
    if (checked) tr.classList.add("done");
    tr.innerHTML = `
      <td class="time mono">${b.time}</td>
      <td class="task">${b.task}</td>
      <td class="check">${b.trackable ? `<input type="checkbox" ${checked ? "checked" : ""} aria-label="done">` : ""}</td>
    `;
    if (b.trackable) {
      tr.querySelector("input").addEventListener("change", (e) => {
        setChecked(day.date, i, e.target.checked);
        if (e.target.checked) tr.classList.add("done"); else tr.classList.remove("done");
        renderProgress();
      });
    }
    tbody.appendChild(tr);
  });

  $("#prev").disabled = idx === 0;
  $("#next").disabled = idx === schedule.days.length - 1;
}

// ---- weeks table ----
function dayOfWeek(iso) {
  const d = isoToDate(iso);
  return d.getDay();
}
function renderWeeks() {
  const tbody = $("#weeks-body");
  tbody.innerHTML = "";
  const today = todayISO();
  const deadlineByDate = {};
  for (const d of schedule.deadlines) {
    if (!deadlineByDate[d.date]) deadlineByDate[d.date] = [];
    deadlineByDate[d.date].push(d.label);
  }
  schedule.days.forEach((day, i) => {
    const tr = document.createElement("tr");
    const isToday = day.date === today || (day.date === "2026-06-01" && today >= "2026-06-01" && today <= "2026-06-05");
    if (isToday) tr.classList.add("today");
    const dl = deadlineByDate[day.date];
    if (dl) tr.classList.add("deadline");
    if (dayOfWeek(day.date) === 6 && i !== 0) tr.classList.add("weekstart"); // Saturday begins each week in this plan
    const eventText = dl ? dl.join(" / ") : "";
    tr.innerHTML = `
      <td class="day mono"><a data-iso="${day.date}">${day.label}</a></td>
      <td class="event">${eventText}</td>
      <td class="focus">${day.focus || ""}</td>
    `;
    tr.querySelector("a").addEventListener("click", () => {
      currentISO = day.date;
      currentNote = "";
      renderDay();
      window.scrollTo({ top: 0, behavior: "smooth" });
    });
    tbody.appendChild(tr);
  });
}

// ---- nav ----
function go(delta) {
  const idx = dayIndex(currentISO);
  const next = idx + delta;
  if (next < 0 || next >= schedule.days.length) return;
  currentISO = schedule.days[next].date;
  currentNote = "";
  renderDay();
}
function jumpToday() {
  const t = todayISO();
  const c = clampToPlan(t);
  currentISO = c.iso;
  currentNote = c.note;
  renderDay();
}

// ---- init ----
function init() {
  const c = clampToPlan(todayISO());
  currentISO = c.iso;
  currentNote = c.note;
  renderDeadlines();
  renderProgress();
  renderDay();
  renderWeeks();

  $("#prev").addEventListener("click", () => go(-1));
  $("#next").addEventListener("click", () => go(1));
  $("#today").addEventListener("click", jumpToday);
  $("#jumpAll").addEventListener("click", () => {
    document.getElementById("all-weeks").scrollIntoView({ behavior: "smooth", block: "start" });
  });

  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) return;
    if (e.key === "ArrowLeft") { go(-1); }
    else if (e.key === "ArrowRight") { go(1); }
    else if (e.key.toLowerCase() === "t") { jumpToday(); }
  });
}
init();
</script>
</body>
</html>
